<main>
    <!-- ═══════════════════════ CHANGE PASSWORD START ═══════════════════════ -->
    <section aria-labelledby="change-password-title" class="mx-auto w-full max-w-auth-wide px-4 py-8">
        <div class="max-w-auth mx-auto rounded-card border-3 border-line bg-surface p-5.5 text-ink shadow-brutal-lg">
            <form id="change-password-form" action="/settings/password" method="post">
                <span
                    class="inline-block rounded-full border-2 border-line bg-pop-yellow px-2.5 py-0.75 font-mono text-caption font-bold text-ink">SECURITY</span>

                <h1 id="change-password-title" class="mt-3 text-heading leading-tight font-extrabold">
                    Change password
                </h1>
                <p class="mt-1.5 leading-snug font-medium">
                    Pick something strong. Future you says thanks.
                </p>

                <!--
              Error chips are pure CSS: each <p role="alert"> stays hidden until its input
              (the `peer`) becomes :user-invalid, i.e. after the user has touched it.
            -->

                <!-- 1 · Current password -->
                <label for="current-password" class="mt-4 mb-1.5 block font-mono text-label font-bold uppercase">Current
                    password</label>
                <input id="current-password" name="currentPassword" type="password" autocomplete="current-password"
                    placeholder="Your current password" required class="form-control" />
                <p role="alert" class="mt-1.5 hidden peer-user-invalid:block">
                    <span
                        class="inline-block rounded-chip border-2 border-line bg-accent px-1.5 font-mono text-caption font-bold">Enter
                        your current password.</span>
                </p>

                <!-- 2 · New password -->
                <label for="new-password" class="mt-4 mb-1.5 block font-mono text-label font-bold uppercase">New
                    password</label>
                <input id="new-password" name="newPassword" type="password" autocomplete="new-password"
                    placeholder="8+ characters" required minlength="8" aria-describedby="new-password-hint"
                    class="form-control" />
                <p id="new-password-hint" class="mt-1.5 font-mono text-label font-bold">
                    At least 8 characters. Mix letters, numbers and a symbol.
                </p>
                <p role="alert" class="mt-1.5 hidden peer-user-invalid:block">
                    <span
                        class="inline-block rounded-chip border-2 border-line bg-accent px-1.5 font-mono text-caption font-bold">At
                        least 8 characters, please.</span>
                </p>

                <!-- 3 · Confirm password -->
                <label for="confirm-password" class="mt-4 mb-1.5 block font-mono text-label font-bold uppercase">Confirm
                    new password</label>
                <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password"
                    placeholder="Same again" required minlength="8" class="form-control" />
                <p role="alert" class="mt-1.5 hidden peer-user-invalid:block">
                    <span
                        class="inline-block rounded-chip border-2 border-line bg-accent px-1.5 font-mono text-caption font-bold">Type
                        the same password again.</span>
                </p>

                <!-- Submit -->
                <button type="submit"
                    class="mt-5.5 inline-flex min-h-12 w-full cursor-pointer items-center justify-center gap-2 rounded-control border-3 border-line bg-accent px-5 py-3 font-sans text-button font-extrabold text-ink shadow-brutal-md transition-[translate,box-shadow] duration-100 ease-pop hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-brutal-xs active:translate-x-1 active:translate-y-1 active:shadow-none disabled:cursor-not-allowed disabled:opacity-60 focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-ink motion-reduce:transition-none">
                    Update password
                </button>

                <p class="mt-4.5 text-center">
                    <a routerLink="/profile"
                        class="font-extrabold text-ink underline decoration-2 underline-offset-4 hover:bg-primary focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-ink">&larr;
                        Back to Profile</a>
                </p>
            </form>
        </div>
    </section>
    <!-- ════════════════════════ CHANGE PASSWORD END ════════════════════════ -->
</main>
