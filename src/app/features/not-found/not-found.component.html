<div class="bg-pop-yellow">
    <main class="flex min-h-dvh flex-col items-center justify-center gap-7 px-6 py-10">
        <!-- Logo -->
        <a routerLink="/feed" aria-label="PopBlock home"
            class="inline-block -rotate-2 rounded-logo border-3 border-line bg-surface px-3 py-1 text-2xl font-extrabold text-ink no-underline shadow-brutal-md transition-[translate,box-shadow] duration-100 ease-pop hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-brutal-xs active:translate-x-1 active:translate-y-1 active:shadow-none focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-ink motion-reduce:transition-none">
            POP<span class="ml-1 rounded-chip bg-ink px-1.5 text-primary">BLOCK</span>
        </a>

        <div class="flex flex-col items-center gap-6 text-center">
            <!-- Giant outlined numeral -->
            <h1
                class="text-giant font-extrabold text-surface [-webkit-text-stroke:4px_var(--color-line)] [text-shadow:10px_10px_0_var(--color-line)]">
                404<span class="sr-only"> — page not found</span>
            </h1>

            <!-- Tilted sticker tag (wiggles on hover) -->
            <p
                class="inline-block -rotate-3 rounded-full border-2 border-line bg-accent px-4 py-1.5 font-mono text-base font-bold text-ink transition-transform duration-150 ease-pop hover:rotate-3 motion-reduce:transition-none">
                PLOT TWIST
            </p>

            <!-- Copy -->
            <div class="max-w-md">
                <p class="text-heading leading-tight font-extrabold">Well, this is awkward.</p>
                <p class="mt-3 text-lead leading-snug font-semibold">
                    The page you wanted just left the chat, but the party is still going. Hop back to the
                    feed before you miss something loud.
                </p>
            </div>

            <!-- Actions -->
            <div class="flex flex-wrap items-center justify-center gap-3">
                <a routerLink="/feed"
                    class="inline-flex min-h-12 items-center justify-center gap-2 rounded-control border-3 border-line bg-accent px-5 py-3 text-button font-extrabold text-ink no-underline shadow-brutal-md transition-[translate,box-shadow] duration-100 ease-pop hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-brutal-xs active:translate-x-1 active:translate-y-1 active:shadow-none focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-ink motion-reduce:transition-none">
                    Take me back to the feed
                </a>
                <!-- <a href="/search"
                    class="inline-flex min-h-11 items-center gap-2 rounded-control border-3 border-line bg-surface px-3.5 py-2 text-small font-extrabold text-ink no-underline shadow-brutal-sm transition-[translate,box-shadow] duration-100 ease-pop hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-brutal-xs active:translate-x-1 active:translate-y-1 active:shadow-none focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-ink motion-reduce:transition-none">
                    Search for something else
                </a> -->
            </div>
        </div>

        <!-- Sticker -->
        <p class="rotate-2 border-3 border-line bg-surface px-3.5 py-2 font-mono text-label font-bold text-ink">
            ERROR 404 · VIBES INTACT
        </p>
    </main>
</div>
